name: MacOS Build for GNU Emacs

on:
  workflow_dispatch:
    inputs:
      test_build:
        description: Build even when releases exist, without publishing
        required: false
        default: false
        type: boolean
      test_master_only:
        description: Build only the master channel during a test build
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 0,12,18 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: master
            branch: master
            build_dir: emacs-master
            tarball: Emacs-master.tar.xz
            artifact_prefix: Emacs-master
            extra_configure: ""
          - name: emacs-31
            branch: emacs-31
            build_dir: emacs
            tarball: Emacs.tar.xz
            artifact_prefix: Emacs
            extra_configure: ""
          - name: igc
            branch: feature/igc3
            build_dir: emacs-igc
            tarball: Emacs-igc.tar.xz
            artifact_prefix: Emacs-igc
            extra_configure: "--with-mps"
    env:
      DEPS_CACHE_VERSION: v7-resumable-dependencies
      DEPS_PREFIX: ${{ github.workspace }}/deps
      RELEASE_RETENTION: "21"
      CFLAGS: -flto -g0 -O2
    steps:
      - name: Select matrix entry
        id: select
        run: |
          if [[ '${{ inputs.test_master_only }}' == 'true' && '${{ matrix.name }}' != 'master' ]]; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
          else
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Get upstream commit hash
        if: steps.select.outputs.run == 'true'
        id: get_commit
        run: |
          COMMIT_HASH=$(git ls-remote https://github.com/emacs-mirror/emacs.git refs/heads/${{ matrix.branch }} | cut -f1)
          echo "commit_hash=${COMMIT_HASH}" >> $GITHUB_OUTPUT
          echo "short_hash=${COMMIT_HASH:0:7}" >> $GITHUB_OUTPUT
          echo "tag=${{ matrix.name }}-${COMMIT_HASH:0:7}" >> $GITHUB_OUTPUT
      - name: Check if release exists
        if: steps.select.outputs.run == 'true'
        id: check_release
        uses: actions/github-script@v9
        with:
          script: |
            const testBuild = context.eventName === "workflow_dispatch"
              && context.payload.inputs?.test_build === "true";
            if (testBuild) {
              core.info("Test build requested; bypassing the release check.");
              core.setOutput("exists", "false");
              return;
            }
            const tag = "${{ steps.get_commit.outputs.tag }}";
            const { owner, repo } = context.repo;
            try {
              await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              core.setOutput("exists", "true");
            } catch (error) {
              if (error.status === 404) {
                core.setOutput("exists", "false");
                return;
              }
              throw error;
            }
      - name: Checkout build scripts
        if: steps.select.outputs.run == 'true' && steps.check_release.outputs.exists != 'true'
        uses: actions/checkout@v5
      - name: Uninstall Homebrew
        if: steps.select.outputs.run == 'true' && steps.check_release.outputs.exists != 'true'
        run: |
          curl -fO https://raw.githubusercontent.com/Homebrew/install/HEAD/uninstall.sh --retry 3
          sudo chmod +x uninstall.sh
          sudo env NONINTERACTIVE=1 ./uninstall.sh
          sudo rm -rf /opt/homebrew
          export PATH=''
          eval $(/usr/libexec/path_helper -s)
      - name: Add dependency bin to PATH
        if: steps.select.outputs.run == 'true' && steps.check_release.outputs.exists != 'true'
        run: echo "${DEPS_PREFIX}/bin" >> $GITHUB_PATH
      - name: Identify dependency toolchain
        if: steps.select.outputs.run == 'true' && steps.check_release.outputs.exists != 'true'
        id: dependency-toolchain
        run: |
          set -euo pipefail
          toolchain_fingerprint=$(
            {
              xcodebuild -version
              xcrun --sdk macosx --show-sdk-version
              xcrun --find clang
              clang --version
            } | shasum -a 256 | cut -d ' ' -f1
          )
          echo "fingerprint=${toolchain_fingerprint}" >> "$GITHUB_OUTPUT"
      - name: Restore dependencies
        if: steps.select.outputs.run == 'true' && steps.check_release.outputs.exists != 'true'
        id: cache-deps
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.DEPS_PREFIX }}
          key: deps-${{ runner.os }}-${{ runner.arch }}-${{ env.DEPS_CACHE_VERSION }}-${{ steps.dependency-toolchain.outputs.fingerprint }}-complete
          restore-keys: |
            deps-${{ runner.os }}-${{ runner.arch }}-${{ env.DEPS_CACHE_VERSION }}-${{ steps.dependency-toolchain.outputs.fingerprint }}-partial-
      - name: Check dependency cache
        if: steps.select.outputs.run == 'true' && steps.check_release.outputs.exists != 'true'
        id: dependency-cache
        run: |
          if [[ -f "${DEPS_PREFIX}/.built" ]]; then
            echo 'complete=true' >> "$GITHUB_OUTPUT"
          else
            echo 'complete=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Build dependencies
        if: steps.select.outputs.run == 'true' && steps.check_release.outputs.exists != 'true' && steps.dependency-cache.outputs.complete != 'true'
        id: build-deps
        run: |
          set -euo pipefail
          export PATH="${DEPS_PREFIX}/bin:${PATH}"
          export PKG_CONFIG_PATH="${DEPS_PREFIX}/lib/pkgconfig:${DEPS_PREFIX}/share/pkgconfig"
          export CPPFLAGS="-I${DEPS_PREFIX}/include"
          export LDFLAGS="-L${DEPS_PREFIX}/lib"
          mkdir -p "${DEPS_PREFIX}"
          dependency_marker_dir="${DEPS_PREFIX}/.dependency-markers"
          mkdir -p "${dependency_marker_dir}"
          dependency_is_built() {
            [[ -f "${dependency_marker_dir}/$1" ]]
          }
          mark_dependency_built() {
            touch "${dependency_marker_dir}/$1"
          }
          if ! dependency_is_built m4; then
            curl -fLO https://ftpmirror.gnu.org/gnu/m4/m4-1.4.21.tar.xz --retry 3
            tar -Jxf m4-1.4.21.tar.xz && cd m4-1.4.21
            ./configure --prefix="${DEPS_PREFIX}" && make -j4
            make install
            cd ..
            mark_dependency_built m4
          fi
          if ! dependency_is_built autoconf; then
            curl -fLO https://ftpmirror.gnu.org/gnu/autoconf/autoconf-2.73.tar.xz --retry 3
            tar -Jxf autoconf-2.73.tar.xz && cd autoconf-2.73
            ./configure --prefix="${DEPS_PREFIX}" && make -j4
            make install
            cd ..
            mark_dependency_built autoconf
          fi
          if ! dependency_is_built automake; then
            curl -fLO https://ftpmirror.gnu.org/gnu/automake/automake-1.18.1.tar.xz --retry 3
            tar -Jxf automake-1.18.1.tar.xz && cd automake-1.18.1
            ./configure --prefix="${DEPS_PREFIX}" && make -j4
            make install
            cd ..
            mark_dependency_built automake
          fi
          if ! dependency_is_built libtool; then
            curl -fLO https://ftpmirror.gnu.org/gnu/libtool/libtool-2.6.2.tar.xz --retry 3
            tar -Jxf libtool-2.6.2.tar.xz && cd libtool-2.6.2
            ./configure --prefix="${DEPS_PREFIX}" --disable-shared && make -j4
            make install
            cd ..
            mark_dependency_built libtool
          fi
          if ! dependency_is_built pkgconf; then
            curl -fLO https://github.com/pkgconf/pkgconf/archive/refs/tags/pkgconf-3.0.3.tar.gz --retry 3
            tar -zxf pkgconf-3.0.3.tar.gz && cd pkgconf-pkgconf-3.0.3
            ./autogen.sh && ./configure --prefix="${DEPS_PREFIX}" --disable-shared && make -j4
            make install
            ln -sf "${DEPS_PREFIX}/bin/pkgconf" "${DEPS_PREFIX}/bin/pkg-config"
            cd ..
            mark_dependency_built pkgconf
          fi
          if ! dependency_is_built texinfo; then
            curl -fLO https://ftpmirror.gnu.org/gnu/texinfo/texinfo-7.3.tar.xz --retry 3
            tar -Jxf texinfo-7.3.tar.xz && cd texinfo-7.3
            ./configure --prefix="${DEPS_PREFIX}" && make -j4
            make install
            cd ..
            mark_dependency_built texinfo
          fi
          if ! dependency_is_built libiconv; then
            curl -fLO https://ftpmirror.gnu.org/gnu/libiconv/libiconv-1.19.tar.gz --retry 3
            tar -zxf libiconv-1.19.tar.gz && cd libiconv-1.19
            ./configure --prefix="${DEPS_PREFIX}" --disable-shared && make -j4
            make install
            cd ..
            mark_dependency_built libiconv
          fi
          if ! dependency_is_built libunistring; then
            curl -fLO https://ftpmirror.gnu.org/gnu/libunistring/libunistring-1.4.2.tar.xz --retry 3
            tar -Jxf libunistring-1.4.2.tar.xz && cd libunistring-1.4.2
            ./configure --prefix="${DEPS_PREFIX}" --disable-shared && make -j4
            make install
            cd ..
            mark_dependency_built libunistring
          fi
          if ! dependency_is_built gettext; then
            curl -fLO https://ftpmirror.gnu.org/gnu/gettext/gettext-1.0.tar.xz --retry 3
            tar -Jxf gettext-1.0.tar.xz && cd gettext-1.0
            ./configure --prefix="${DEPS_PREFIX}" --disable-shared && make -j4
            make install
            cd ..
            mark_dependency_built gettext
          fi
          if ! dependency_is_built ncurses; then
            curl -fLO https://ftpmirror.gnu.org/gnu/ncurses/ncurses-6.6.tar.gz --retry 3
            tar -zxf ncurses-6.6.tar.gz && cd ncurses-6.6
            ./configure --prefix="${DEPS_PREFIX}" --disable-shared && make -j4
            make install
            ln -sf "${DEPS_PREFIX}/include/ncursesw/curses.h" "${DEPS_PREFIX}/include/ncurses.h"
            cd ..
            mark_dependency_built ncurses
          fi
          if ! dependency_is_built zlib; then
            curl -fLO https://github.com/madler/zlib/releases/download/v1.3.2/zlib-1.3.2.tar.xz --retry 3
            tar -Jxf zlib-1.3.2.tar.xz && cd zlib-1.3.2
            ./configure --static --prefix="${DEPS_PREFIX}" && make -j4
            make install
            cd ..
            mark_dependency_built zlib
          fi
          if ! dependency_is_built libxml2; then
            curl -fO https://download.gnome.org/sources/libxml2/2.15/libxml2-2.15.3.tar.xz --retry 3
            tar -Jxf libxml2-2.15.3.tar.xz && cd libxml2-2.15.3
            ./configure --prefix="${DEPS_PREFIX}" --disable-shared && make -j4
            make install
            cd ..
            mark_dependency_built libxml2
          fi
          if ! dependency_is_built gmp; then
            curl -fLO https://ftpmirror.gnu.org/gnu/gmp/gmp-6.3.0.tar.xz --retry 3
            tar -Jxf gmp-6.3.0.tar.xz && cd gmp-6.3.0
            ./configure --prefix="${DEPS_PREFIX}" --disable-shared && make -j4
            make install
            cd ..
            mark_dependency_built gmp
          fi
          if ! dependency_is_built mpfr; then
            curl -fLO https://ftpmirror.gnu.org/gnu/mpfr/mpfr-4.2.2.tar.xz --retry 3
            tar -Jxf mpfr-4.2.2.tar.xz && cd mpfr-4.2.2
            ./configure --prefix="${DEPS_PREFIX}" --disable-shared --with-gmp="${DEPS_PREFIX}" && make -j4
            make install
            cd ..
            mark_dependency_built mpfr
          fi
          if ! dependency_is_built mpc; then
            curl -fLO https://ftpmirror.gnu.org/gnu/mpc/mpc-1.3.1.tar.gz --retry 3
            tar -zxf mpc-1.3.1.tar.gz && cd mpc-1.3.1
            ./configure --prefix="${DEPS_PREFIX}" --disable-shared \
                        --with-gmp="${DEPS_PREFIX}" --with-mpfr="${DEPS_PREFIX}" && make -j4
            make install
            cd ..
            mark_dependency_built mpc
          fi
          if ! dependency_is_built isl; then
            curl -fLO https://libisl.sourceforge.io/isl-0.27.tar.xz --retry 3
            tar -Jxf isl-0.27.tar.xz && cd isl-0.27
            ./configure --prefix="${DEPS_PREFIX}" --disable-shared \
                        --with-gmp-prefix="${DEPS_PREFIX}" && make -j4
            make install
            cd ..
            mark_dependency_built isl
          fi
          if ! dependency_is_built nettle; then
            curl -fLO https://ftpmirror.gnu.org/gnu/nettle/nettle-4.0.tar.gz --retry 3
            tar -zxf nettle-4.0.tar.gz && cd nettle-4.0
            ./configure --prefix="${DEPS_PREFIX}" --disable-shared && make -j4
            make install
            cd ..
            mark_dependency_built nettle
          fi
          if ! dependency_is_built libidn2; then
            curl -fLO https://ftpmirror.gnu.org/gnu/libidn/libidn2-2.3.8.tar.gz --retry 3
            tar -zxf libidn2-2.3.8.tar.gz && cd libidn2-2.3.8
            ./configure --prefix="${DEPS_PREFIX}" --disable-shared && make -j4
            make install
            cd ..
            mark_dependency_built libidn2
          fi
          if ! dependency_is_built gnutls; then
            curl -fO https://www.gnupg.org/ftp/gcrypt/gnutls/v3.8/gnutls-3.8.13.tar.xz --retry 3
            tar -Jxf gnutls-3.8.13.tar.xz && cd gnutls-3.8.13
            ./configure --prefix="${DEPS_PREFIX}" --disable-shared --with-included-libtasn1 --without-p11-kit && make -j4
            make install
            cd ..
            mark_dependency_built gnutls
          fi
          if ! dependency_is_built tree-sitter; then
            curl -fLO https://github.com/tree-sitter/tree-sitter/archive/refs/tags/v0.26.11.tar.gz --retry 3
            tar -zxf v0.26.11.tar.gz && cd tree-sitter-0.26.11
            make -j4
            make install PREFIX="${DEPS_PREFIX}"
            find "${DEPS_PREFIX}/lib" -name 'libtree-sitter*.dylib' -delete
            cd ..
            mark_dependency_built tree-sitter
          fi
          if ! dependency_is_built sqlite; then
            curl -fO https://www.sqlite.org/2026/sqlite-autoconf-3530100.tar.gz --retry 3
            tar -zxf sqlite-autoconf-3530100.tar.gz && cd sqlite-autoconf-3530100
            ./configure --prefix="${DEPS_PREFIX}" --disable-shared && make -j4
            make install
            cd ..
            mark_dependency_built sqlite
          fi
          if ! dependency_is_built gzip; then
            curl -fLO https://ftpmirror.gnu.org/gnu/gzip/gzip-1.14.tar.xz --retry 3
            tar -Jxf gzip-1.14.tar.xz && cd gzip-1.14
            ./configure --prefix="${DEPS_PREFIX}" && make -j4
            make install
            cd ..
            mark_dependency_built gzip
          fi
          if ! dependency_is_built gcc; then
            JOBS=4 bash "${GITHUB_WORKSPACE}/scripts/build-static-libgccjit.sh"
            mark_dependency_built gcc
          fi
          touch "${DEPS_PREFIX}/.built"
      - name: Save partial dependency cache
        if: always() && steps.build-deps.outcome == 'failure'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.DEPS_PREFIX }}
          key: deps-${{ runner.os }}-${{ runner.arch }}-${{ env.DEPS_CACHE_VERSION }}-${{ steps.dependency-toolchain.outputs.fingerprint }}-partial-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save complete dependency cache
        if: steps.select.outputs.run == 'true' && steps.check_release.outputs.exists != 'true' && steps.dependency-cache.outputs.complete != 'true' && steps.build-deps.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.DEPS_PREFIX }}
          key: ${{ steps.cache-deps.outputs.cache-primary-key }}
      - name: Build Emacs
        if: steps.select.outputs.run == 'true' && steps.check_release.outputs.exists != 'true'
        run: |
          set -euo pipefail
          export PATH="${DEPS_PREFIX}/bin:${PATH}"
          export CC=/usr/bin/clang
          export CXX=/usr/bin/clang++
          export OBJC=/usr/bin/clang
          export OBJCXX=/usr/bin/clang++
          export PKG_CONFIG_PATH="${DEPS_PREFIX}/lib/pkgconfig:${DEPS_PREFIX}/share/pkgconfig"
          export CPPFLAGS="-I${DEPS_PREFIX}/include"
          find "${DEPS_PREFIX}" \( -type f -o -type l \) \
            \( -name '*.dylib' -o -name '*.so' -o -name '*.so.*' \) -print -delete
          libstdcxx_archive=$(find "${DEPS_PREFIX}" -name 'libstdc++.a' -type f -print -quit)
          libgcc_archive=$(find "${DEPS_PREFIX}" -name 'libgcc.a' -type f -print -quit)
          test -f "${libstdcxx_archive}"
          test -f "${libgcc_archive}"
          export LDFLAGS="-L${DEPS_PREFIX}/lib"
          export LIBS="${libstdcxx_archive} ${libgcc_archive} -lisl -lmpc -lmpfr -lgmp -lz -liconv"
          git clone --depth 1 -b '${{ matrix.branch }}' https://github.com/emacs-mirror/emacs.git '${{ matrix.build_dir }}'
          cd '${{ matrix.build_dir }}' && sed -i '' '/darwin/ s/lncurses/lncursesw/g' configure.ac
          curl -fL -O https://github.com/d12frosted/homebrew-emacs-plus/raw/refs/heads/master/patches/emacs-31/system-appearance.patch --retry 3
          curl -fL -O https://github.com/d12frosted/homebrew-emacs-plus/raw/refs/heads/master/patches/emacs-31/round-undecorated-frame.patch --retry 3
          patch -f -V none -p1 < system-appearance.patch
          patch -f -V none -p1 < round-undecorated-frame.patch
          patch -f -V none -p1 < "${GITHUB_WORKSPACE}/patches/emacs-native-comp-static-runtime.patch"
          ./autogen.sh
          if ! ./configure ac_cv_search___gmpz_roinit_n=-lgmp \
                           PKG_CONFIG="${DEPS_PREFIX}/bin/pkgconf --static" \
                           --disable-build-details          \
                           --disable-gc-mark-trace          \
                           --without-all                    \
                           --with-compress-install          \
                           --with-file-notification=kqueue  \
                           --with-libgmp                    \
                           --with-gnutls                    \
                           --with-modules                   \
                           --with-native-compilation=yes    \
                           --with-native-image-api          \
                           --with-ns                        \
                           --with-small-ja-dic              \
                           --with-threads                   \
                           --with-toolkit-scroll-bars       \
                           --with-tree-sitter               \
                           --with-xwidgets                  \
                           --with-xml2                      \
                           --with-zlib                      \
                           --with-sqlite3                   \
                           --prefix="${PWD}/../emacs-install" \
                           ${{ matrix.extra_configure }}; then
            grep -n -B 30 -A 120 'gcc_jit_context_acquire' config.log \
              || tail -n 400 config.log
            exit 1
          fi
          allocator_symbols=$(mktemp)
          trap 'rm -f "${allocator_symbols}"' EXIT
          printf '%s\n' _xmalloc _xcalloc _xrealloc > "${allocator_symbols}"
          /usr/bin/nmedit -D -R "${allocator_symbols}" "${DEPS_PREFIX}/lib/libgccjit.a"
          if /usr/bin/nm -gU "${DEPS_PREFIX}/lib/libgccjit.a" \
               | awk '{ print $NF }' \
               | grep -Fxf "${allocator_symbols}"; then
            echo "libgccjit allocator symbols remain globally visible" >&2
            exit 1
          fi
          make -j4 && make install
          ditto nextstep/Emacs.app Emacs.app
          native_runtime_dir=Emacs.app/Contents/Frameworks/libgccjit
          emutls_archive=$(find "${DEPS_PREFIX}" -name 'libemutls_w.a' -type f -print -quit)
          test -f "${emutls_archive}"
          gcc_runtime_source_dir=$(dirname "${emutls_archive}")
          mkdir -p "${native_runtime_dir}"
          for runtime_archive in libgcc.a libemutls_w.a libheapt_w.a; do
            test -f "${gcc_runtime_source_dir}/${runtime_archive}"
            cp "${gcc_runtime_source_dir}/${runtime_archive}" "${native_runtime_dir}/"
          done
          unexpected_shared_files=$(find Emacs.app \( -type f -o -type l \) \
            \( -name '*.dylib' -o -name '*.so' -o -name '*.so.*' \) -print)
          if [[ -n "${unexpected_shared_files}" ]]; then
            echo "Unexpected third-party dynamic library files in Emacs.app:" >&2
            echo "${unexpected_shared_files}" >&2
            exit 1
          fi
          non_system_libraries=$(otool -L Emacs.app/Contents/MacOS/Emacs \
            | tail -n +2 | awk '{ print $1 }' \
            | grep -Ev '^(/System/Library/|/usr/lib/)' || true)
          if [[ -n "${non_system_libraries}" ]]; then
            echo "Unexpected non-system dynamic libraries:" >&2
            echo "${non_system_libraries}" >&2
            exit 1
          fi
          hidden_deps="${DEPS_PREFIX}.native-comp-smoke"
          native_comp_home=$(mktemp -d)
          mv "${DEPS_PREFIX}" "${hidden_deps}"
          restore_deps() {
            if [[ -d "${hidden_deps}" && ! -d "${DEPS_PREFIX}" ]]; then
              mv "${hidden_deps}" "${DEPS_PREFIX}"
            fi
          }
          trap restore_deps EXIT
          env -u CPPFLAGS -u LDFLAGS -u LIBS -u LIBRARY_PATH -u PKG_CONFIG_PATH \
            -u SDKROOT \
            HOME="${native_comp_home}" \
            PATH='/usr/bin:/bin:/usr/sbin:/sbin' \
            Emacs.app/Contents/MacOS/Emacs --batch --eval \
            "(progn
               (require 'comp)
               (unless (native-comp-available-p)
                 (error \"native compilation is unavailable\"))
               (let* ((source (make-temp-file \"native-comp-smoke\" nil \".el\"
                                              \"(defun native-comp-smoke () 42)\\n\"))
                      (eln (native-compile source)))
                 (delete-file source)
                 (unless (and eln (file-exists-p eln))
                   (error \"native compilation produced no .eln file\"))
                 (load eln nil nil t)
                 (unless (= (native-comp-smoke) 42)
                   (error \"native-compiled function returned the wrong value\"))))"
          compiled_eln=$(find "${native_comp_home}" -name 'native-comp-smoke*.eln' -type f -print -quit)
          test -f "${compiled_eln}"
          non_system_eln_libraries=$(otool -L "${compiled_eln}" \
            | tail -n +2 | awk -v id="$(basename "${compiled_eln}")" '$1 != id { print $1 }' \
            | grep -Ev '^(/System/Library/|/usr/lib/)' || true)
          if [[ -n "${non_system_eln_libraries}" ]]; then
            echo "Unexpected non-system dynamic libraries in generated .eln:" >&2
            echo "${non_system_eln_libraries}" >&2
            exit 1
          fi
          rm -rf "${native_comp_home}"
          restore_deps
          trap - EXIT
          # Add command-line helpers used by the packaged apps.
          cat > Emacs.app/Contents/MacOS/bin/emacs << 'EOF'
          #!/bin/bash
          exec /Applications/Emacs.app/Contents/MacOS/Emacs "$@"
          EOF
          chmod +x Emacs.app/Contents/MacOS/bin/emacs
          # Replace app icon
          curl -fLO https://github.com/jimeh/emacs-liquid-glass-icons/raw/refs/heads/main/Resources/EmacsLG3-Default.icns --retry 3
          mv EmacsLG3-Default.icns Emacs.app/Contents/Resources/Emacs.icns
          curl -fLO https://github.com/jimeh/emacs-liquid-glass-icons/raw/refs/heads/main/Resources/Assets.car --retry 3
          mv Assets.car Emacs.app/Contents/Resources/Assets.car
          plutil -replace CFBundleIconName -string EmacsLG3 Emacs.app/Contents/Info.plist
          touch Emacs.app
          ARTIFACT_VERSION=$(Emacs.app/Contents/MacOS/Emacs --version | sed -nE 's/^GNU Emacs ([0-9.]+).*/\1/p')
          echo "ARTIFACT_VERSION=${ARTIFACT_VERSION}" >> $GITHUB_ENV
          bash "${GITHUB_WORKSPACE}/scripts/create-emacs-client-app.sh" \
            --emacs-app Emacs.app \
            --client-app "Emacs Client.app" \
            --version "${ARTIFACT_VERSION}"
          codesign --force --deep -s - Emacs.app
          codesign --force --deep -s - "Emacs Client.app"
          tar -Jcf '${{ matrix.tarball }}' Emacs.app "Emacs Client.app"
      - name: Upload test artifact
        if: steps.select.outputs.run == 'true' && steps.check_release.outputs.exists != 'true' && github.event_name == 'workflow_dispatch' && inputs.test_build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_prefix }}-${{ env.ARTIFACT_VERSION }}-${{ steps.get_commit.outputs.short_hash }}
          path: ${{ matrix.build_dir }}/${{ matrix.tarball }}
          if-no-files-found: error
          compression-level: 0
      - name: Publish release
        if: steps.select.outputs.run == 'true' && steps.check_release.outputs.exists != 'true' && !(github.event_name == 'workflow_dispatch' && inputs.test_build)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.get_commit.outputs.tag }}
          name: Emacs ${{ matrix.name }} ${{ env.ARTIFACT_VERSION }} (${{ steps.get_commit.outputs.short_hash }})
          body: |
            Upstream: https://github.com/emacs-mirror/emacs/commit/${{ steps.get_commit.outputs.commit_hash }}
            Branch: ${{ matrix.branch }}
            Emacs version: ${{ env.ARTIFACT_VERSION }}
          files: ${{ matrix.build_dir }}/${{ matrix.tarball }}
      - name: Delete older releases for branch
        if: steps.select.outputs.run == 'true' && steps.check_release.outputs.exists != 'true' && !(github.event_name == 'workflow_dispatch' && inputs.test_build)
        uses: actions/github-script@v9
        with:
          script: |
            const prefix = `${{ matrix.name }}-`;
            const retentionCount = Number.parseInt(process.env.RELEASE_RETENTION, 10);
            const { owner, repo } = context.repo;

            if (!Number.isInteger(retentionCount) || retentionCount < 1) {
              throw new Error(`Invalid release retention count: ${process.env.RELEASE_RETENTION}`);
            }

            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner,
              repo,
              per_page: 100,
            });

            const toDelete = releases
              .filter((release) => release.tag_name.startsWith(prefix))
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))
              .slice(retentionCount);

            for (const release of toDelete) {
              core.info(`Deleting release ${release.tag_name} (id=${release.id})`);
              await github.rest.repos.deleteRelease({
                owner,
                repo,
                release_id: release.id,
              });
            }
