name: MacOS Build for GNU Emacs

on:
  workflow_dispatch:
    inputs:
      test_build:
        description: Build without publishing; upload tarballs as artifacts
        required: false
        default: false
        type: boolean
      channels:
        description: Comma-separated channels to build (empty = all)
        required: false
        default: ""
        type: string
  schedule:
    - cron: "0 0,12,18 * * *"

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      any: ${{ steps.plan.outputs.any }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - name: Determine channels to build
        id: plan
        uses: actions/github-script@v9
        with:
          script: |
            const channels = [
              {
                name: "master",
                branch: "master",
                build_dir: "emacs-master",
                tarball: "Emacs-master.tar.xz",
                artifact_prefix: "Emacs-master",
                extra_configure: "",
              },
              {
                name: "emacs-31",
                branch: "emacs-31",
                build_dir: "emacs",
                tarball: "Emacs.tar.xz",
                artifact_prefix: "Emacs",
                extra_configure: "",
              },
              {
                name: "igc",
                branch: "feature/igc3",
                build_dir: "emacs-igc",
                tarball: "Emacs-igc.tar.xz",
                artifact_prefix: "Emacs-igc",
                extra_configure: "--with-mps",
              },
            ];
            const { owner, repo } = context.repo;
            const testBuild = context.eventName === "workflow_dispatch"
              && context.payload.inputs?.test_build === "true";
            const channelFilter = (context.payload.inputs?.channels ?? "")
              .split(",")
              .map((name) => name.trim())
              .filter(Boolean);
            const unknown = channelFilter.filter(
              (name) => !channels.some((channel) => channel.name === name));
            if (unknown.length > 0) {
              throw new Error(`Unknown channels: ${unknown.join(", ")}`);
            }
            const include = [];
            for (const channel of channels) {
              if (channelFilter.length > 0 && !channelFilter.includes(channel.name)) {
                continue;
              }
              const lsRemote = await exec.getExecOutput("git", [
                "ls-remote",
                "https://github.com/emacs-mirror/emacs.git",
                `refs/heads/${channel.branch}`,
              ]);
              const commitHash = lsRemote.stdout.split("\t")[0].trim();
              if (!/^[0-9a-f]{40}$/.test(commitHash)) {
                throw new Error(`Could not resolve ${channel.branch}: ${lsRemote.stdout}`);
              }
              const tag = `${channel.name}-${commitHash.slice(0, 7)}`;
              if (!testBuild) {
                let exists = false;
                try {
                  await github.rest.repos.getReleaseByTag({ owner, repo, tag });
                  exists = true;
                } catch (error) {
                  if (error.status !== 404) throw error;
                }
                if (exists) {
                  core.info(`Release ${tag} already exists; skipping ${channel.name}.`);
                  continue;
                }
              }
              include.push({
                ...channel,
                commit_hash: commitHash,
                short_hash: commitHash.slice(0, 7),
                tag,
              });
            }
            core.setOutput("matrix", JSON.stringify(include));
            core.setOutput("any", include.length > 0 ? "true" : "false");
            const publish = !testBuild && context.ref === "refs/heads/main";
            core.setOutput("publish", publish ? "true" : "false");
  deps:
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: macos-26
    env:
      DEPS_CACHE_VERSION: v8-no-native-comp
      DEPS_PREFIX: ${{ github.workspace }}/deps
      CFLAGS: -flto -g0 -O2
    outputs:
      cache-key: ${{ steps.cache-deps.outputs.cache-primary-key }}
    steps:
      - name: Checkout build scripts
        uses: actions/checkout@v5
      - name: Uninstall Homebrew
        run: |
          curl -fO https://raw.githubusercontent.com/Homebrew/install/HEAD/uninstall.sh --retry 3
          sudo chmod +x uninstall.sh
          sudo env NONINTERACTIVE=1 ./uninstall.sh
          sudo rm -rf /opt/homebrew
          export PATH=''
          eval $(/usr/libexec/path_helper -s)
      - name: Identify dependency toolchain
        id: dependency-toolchain
        run: |
          set -euo pipefail
          toolchain_fingerprint=$(
            {
              xcodebuild -version
              xcrun --sdk macosx --show-sdk-version
              xcrun --find clang
              clang --version
            } | shasum -a 256 | cut -d ' ' -f1
          )
          echo "fingerprint=${toolchain_fingerprint}" >> "$GITHUB_OUTPUT"
      - name: Restore dependencies
        id: cache-deps
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.DEPS_PREFIX }}
          key: deps-${{ runner.os }}-${{ runner.arch }}-${{ env.DEPS_CACHE_VERSION }}-${{ steps.dependency-toolchain.outputs.fingerprint }}-complete
          restore-keys: |
            deps-${{ runner.os }}-${{ runner.arch }}-${{ env.DEPS_CACHE_VERSION }}-${{ steps.dependency-toolchain.outputs.fingerprint }}-partial-
      - name: Check dependency cache
        id: dependency-cache
        run: |
          if [[ -f "${DEPS_PREFIX}/.built" ]]; then
            echo 'complete=true' >> "$GITHUB_OUTPUT"
          else
            echo 'complete=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Build dependencies
        if: steps.dependency-cache.outputs.complete != 'true'
        id: build-deps
        timeout-minutes: 300
        run: bash scripts/build-deps.sh
      - name: Save partial dependency cache
        if: always() && steps.build-deps.outcome == 'failure'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.DEPS_PREFIX }}
          key: deps-${{ runner.os }}-${{ runner.arch }}-${{ env.DEPS_CACHE_VERSION }}-${{ steps.dependency-toolchain.outputs.fingerprint }}-partial-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save complete dependency cache
        if: steps.dependency-cache.outputs.complete != 'true' && steps.build-deps.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.DEPS_PREFIX }}
          key: ${{ steps.cache-deps.outputs.cache-primary-key }}
  build:
    needs: [plan, deps]
    if: needs.plan.outputs.any == 'true'
    runs-on: macos-26
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      DEPS_PREFIX: ${{ github.workspace }}/deps
      RELEASE_RETENTION: "21"
      CFLAGS: -flto -g0 -O2
    steps:
      - name: Checkout build scripts
        uses: actions/checkout@v5
      - name: Uninstall Homebrew
        run: |
          curl -fO https://raw.githubusercontent.com/Homebrew/install/HEAD/uninstall.sh --retry 3
          sudo chmod +x uninstall.sh
          sudo env NONINTERACTIVE=1 ./uninstall.sh
          sudo rm -rf /opt/homebrew
          export PATH=''
          eval $(/usr/libexec/path_helper -s)
      - name: Restore dependencies
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.DEPS_PREFIX }}
          key: ${{ needs.deps.outputs.cache-key }}
          fail-on-cache-miss: true
      - name: Import signing certificate
        env:
          SIGNING_P12_BASE64: ${{ secrets.SIGNING_P12_BASE64 }}
          SIGNING_P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${SIGNING_P12_BASE64}" || -z "${SIGNING_P12_PASSWORD}" ]]; then
            echo "SIGNING_P12_BASE64 and SIGNING_P12_PASSWORD must be set" >&2
            exit 1
          fi
          keychain="${RUNNER_TEMP}/signing.keychain-db"
          keychain_password=$(uuidgen)
          security create-keychain -p "${keychain_password}" "${keychain}"
          security set-keychain-settings "${keychain}"
          security unlock-keychain -p "${keychain_password}" "${keychain}"
          echo "${SIGNING_P12_BASE64}" | base64 -d > "${RUNNER_TEMP}/signing.p12"
          security import "${RUNNER_TEMP}/signing.p12" -k "${keychain}" \
            -P "${SIGNING_P12_PASSWORD}" -T /usr/bin/codesign
          rm -f "${RUNNER_TEMP}/signing.p12"
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "${keychain_password}" "${keychain}" > /dev/null
          security list-keychains -d user -s "${keychain}" \
            $(security list-keychains -d user | tr -d '"')
          # The self-signed certificate is untrusted, so look it up among all
          # code-signing identities rather than only valid ones.
          identity=$(security find-identity -p codesigning "${keychain}" \
            | awk '/^ +1\)/ { print $2; exit }')
          if [[ -z "${identity}" ]]; then
            echo "No code-signing identity found in the imported certificate" >&2
            exit 1
          fi
          echo "SIGNING_KEYCHAIN=${keychain}" >> "$GITHUB_ENV"
          echo "SIGN_IDENTITY=${identity}" >> "$GITHUB_ENV"
      - name: Build Emacs
        env:
          EMACS_BRANCH: ${{ matrix.branch }}
          BUILD_DIR: ${{ matrix.build_dir }}
          TARBALL: ${{ matrix.tarball }}
          EXTRA_CONFIGURE: ${{ matrix.extra_configure }}
        run: bash scripts/build-emacs.sh
      - name: Verify packaged app
        run: |
          bash scripts/verify-app.sh '${{ matrix.build_dir }}/Emacs.app'
          for app in '${{ matrix.build_dir }}/Emacs.app' '${{ matrix.build_dir }}/Emacs Client.app'; do
            codesign --verify --deep --strict "${app}"
            codesign -d -r- "${app}" 2>&1 | grep -q 'certificate leaf' || {
              echo "${app} is not signed with the stable identity" >&2
              exit 1
            }
          done
      - name: Upload test artifact
        if: needs.plan.outputs.publish != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_prefix }}-${{ env.ARTIFACT_VERSION }}-${{ matrix.short_hash }}
          path: ${{ matrix.build_dir }}/${{ matrix.tarball }}
          if-no-files-found: error
          compression-level: 0
      - name: Publish release
        if: needs.plan.outputs.publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ matrix.tag }}
          name: Emacs ${{ matrix.name }} ${{ env.ARTIFACT_VERSION }} (${{ matrix.short_hash }})
          body: |
            Upstream: https://github.com/emacs-mirror/emacs/commit/${{ matrix.commit_hash }}
            Branch: ${{ matrix.branch }}
            Emacs version: ${{ env.ARTIFACT_VERSION }}
          files: ${{ matrix.build_dir }}/${{ matrix.tarball }}
      - name: Delete signing keychain
        if: always() && env.SIGNING_KEYCHAIN != ''
        run: security delete-keychain "${SIGNING_KEYCHAIN}"
      - name: Delete older releases for branch
        if: needs.plan.outputs.publish == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            // Match tags exactly (name plus 7-hex hash) so that a channel
            // whose name prefixes another's can never have its retention
            // delete the other channel's releases.
            const tagPattern = new RegExp("^${{ matrix.name }}-[0-9a-f]{7}$");
            const retentionCount = Number.parseInt(process.env.RELEASE_RETENTION, 10);
            const { owner, repo } = context.repo;

            if (!Number.isInteger(retentionCount) || retentionCount < 1) {
              throw new Error(`Invalid release retention count: ${process.env.RELEASE_RETENTION}`);
            }

            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner,
              repo,
              per_page: 100,
            });

            const toDelete = releases
              .filter((release) => tagPattern.test(release.tag_name))
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))
              .slice(retentionCount);

            for (const release of toDelete) {
              core.info(`Deleting release ${release.tag_name} (id=${release.id})`);
              await github.rest.repos.deleteRelease({
                owner,
                repo,
                release_id: release.id,
              });
            }
